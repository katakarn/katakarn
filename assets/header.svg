<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="Katakarn">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .dim { fill: #A3A3A3; }
    .gold { fill: #FACC15; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .live { animation: pulse 2s ease-in-out infinite; }
    .scan { animation: scan 6s linear infinite; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.8s ease-in-out infinite alternate; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(240px); } }
    @keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
  </style>
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="838" height="238" rx="14"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FACC15" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="1" stop-color="#FACC15" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#CA8A04"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="840" height="240" fill="#0A0A0A"/>
    <rect y="36" width="840" height="204" fill="url(#grid)"/>
    <rect class="scan" width="840" height="40" fill="url(#beam)"/>

    <!-- title bar -->
    <rect width="840" height="36" fill="#141414"/>
    <line x1="0" y1="36.5" x2="840" y2="36.5" stroke="#262626"/>
    <circle cx="24" cy="18" r="6" fill="#FACC15"/>
    <circle cx="44" cy="18" r="6" fill="#CA8A04"/>
    <circle cx="64" cy="18" r="6" fill="#404040"/>
    <text x="420" y="22" text-anchor="middle" class="mono dim" font-size="12">katakarn@github: ~/profile</text>
    <circle class="live" cx="772" cy="18" r="4" fill="#FACC15"/>
    <text x="782" y="22" class="mono gold" font-size="11" font-weight="700" letter-spacing="1">LIVE</text>

    <!-- terminal body -->
    <text x="40" y="78" class="mono" font-size="15"><tspan class="gold">$</tspan><tspan fill="#E5E5E5"> whoami</tspan></text>
    <text x="36" y="142" class="mono gold" font-size="60" font-weight="800" letter-spacing="8" filter="url(#glow)">KATAKARN</text>
    <text x="40" y="176" class="mono dim" font-size="14">// backend · api · data · ops</text>
    <text x="40" y="214" class="mono gold" font-size="15">$</text>
    <rect class="cursor" x="56" y="202" width="9" height="16" fill="#FACC15"/>

    <!-- activity meter -->
    <text x="800" y="70" text-anchor="end" class="mono dim" font-size="10" letter-spacing="2">SYS.ACTIVITY</text>
    <g fill="url(#barfill)">
      <rect class="bar" x="640" y="90"  width="12" height="110" rx="2" style="animation-delay:-.2s"/>
      <rect class="bar" x="660" y="90"  width="12" height="110" rx="2" style="animation-delay:-1.1s"/>
      <rect class="bar" x="680" y="90"  width="12" height="110" rx="2" style="animation-delay:-.6s"/>
      <rect class="bar" x="700" y="90"  width="12" height="110" rx="2" style="animation-delay:-1.5s"/>
      <rect class="bar" x="720" y="90"  width="12" height="110" rx="2" style="animation-delay:-.9s"/>
      <rect class="bar" x="740" y="90"  width="12" height="110" rx="2" style="animation-delay:-.3s"/>
      <rect class="bar" x="760" y="90"  width="12" height="110" rx="2" style="animation-delay:-1.3s"/>
      <rect class="bar" x="780" y="90"  width="12" height="110" rx="2" style="animation-delay:-.7s"/>
    </g>
    <line x1="636" y1="200.5" x2="800" y2="200.5" stroke="#404040"/>
    <text x="800" y="220" text-anchor="end" class="mono gold" font-size="11" font-weight="700" letter-spacing="2">ALL SYSTEMS ONLINE</text>
  </g>
  <rect x="1" y="1" width="838" height="238" rx="14" fill="none" stroke="#FACC15" stroke-opacity=".35"/>
</svg>
